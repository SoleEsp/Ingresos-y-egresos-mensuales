<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐾 Control Gatuno de Gastos y Tareas 🐱</title>
<style>
  * { box-sizing: border-box; }
  body { 
    margin: 0; 
    font-family: 'Nunito', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; 
    background: #fff5f8; 
    color: #4a3e3d; 
  }
  
  .status { 
    background: #e2f0d9; 
    color: #385d25; 
    padding: 8px 16px; 
    font-size: 13px; 
    text-align: center; 
    font-weight: 700; 
  }
  
  header { 
    background: #fbcfe8; 
    color: #701a75; 
    padding: 18px 24px; 
    display: flex; 
    flex-wrap: wrap; 
    gap: 12px; 
    align-items: center; 
    justify-content: space-between;
    border-bottom: 4px dashed #f472b6;
  }
  header h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 8px; }
  header input[type=month] { 
    padding: 8px 12px; 
    border-radius: 20px; 
    border: 2px solid #f472b6; 
    font-size: 14px; 
    background: #fff;
    color: #701a75;
    outline: none;
  }
  
  nav { display: flex; gap: 8px; padding: 16px 24px 0; flex-wrap: wrap; }
  nav button { 
    padding: 10px 18px; 
    border: none; 
    border-radius: 16px 16px 0 0; 
    background: #fbe7f0; 
    color: #831843; 
    cursor: pointer; 
    font-weight: 700; 
    font-size: 14px;
    transition: all 0.2s;
  }
  nav button.active { 
    background: #ffffff; 
    color: #db2777; 
    box-shadow: 0 -3px 6px rgba(219, 39, 119, 0.1);
  }
  
  main { 
    background: #ffffff; 
    margin: 0 24px 24px; 
    padding: 24px; 
    border-radius: 0 20px 20px 20px; 
    box-shadow: 0 4px 15px rgba(244, 114, 182, 0.15); 
    min-height: 400px; 
  }
  
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .card { border-radius: 16px; padding: 16px; background: #fff0f6; border-left: 6px solid #f472b6; }
  .card.ing { border-color: #86efac; background: #f0fdf4; } 
  .card.gas { border-color: #fda4af; background: #fff1f2; } 
  .card.aho { border-color: #93c5fd; background: #eff6ff; } 
  .card.tasa { border-color: #d8b4fe; background: #faf5ff; }
  .card small { color: #71717a; font-size: 13px; font-weight: 600; }
  .card strong { display: block; font-size: 22px; margin-top: 4px; color: #3f3f46; }
  
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
  .box { border: 2px dashed #fbcfe8; border-radius: 16px; padding: 18px; background: #fff; }
  .box h3 { margin: 0 0 12px; font-size: 16px; color: #9d174d; }
  
  svg { width: 100%; height: auto; }
  ul.legend { list-style: none; padding: 0; margin: 12px 0 0; font-size: 14px; }
  ul.legend li { margin: 6px 0; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  
  .tips { background: #f0fdf4; border: 2px solid #bbf7d0; border-radius: 16px; padding: 16px; margin-top: 20px; color: #166534; }
  .tips.warn { background: #fff1f2; border-color: #fecdd3; color: #9f1239; }
  .tips li { margin: 6px 0; }
  
  form.f { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; align-items: end; margin-bottom: 20px; }
  label { font-size: 13px; color: #831843; display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
  input, select { padding: 10px; border: 2px solid #fbcfe8; border-radius: 12px; font-size: 14px; outline: none; background: #fff; }
  input:focus, select:focus { border-color: #f472b6; }
  
  button.p { padding: 10px 18px; border: none; border-radius: 12px; background: #f472b6; color: #fff; font-weight: 700; cursor: pointer; transition: 0.2s; }
  button.p:hover { background: #ec4899; }
  button.s { padding: 10px 18px; border: none; border-radius: 12px; background: #cbd5e1; color: #334155; font-weight: 700; cursor: pointer; }
  button.d { padding: 6px 12px; border: none; border-radius: 8px; background: #ffe4e6; color: #e11d48; font-weight: 700; cursor: pointer; }
  
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px; border-bottom: 1px solid #fce7f3; text-align: left; }
  th { background: #fff0f6; color: #9d174d; }
  td.r, th.r { text-align: right; }
  .ingt { color: #16a34a; font-weight: 700; } .gast { color: #e11d48; font-weight: 700; }
  
  .bar { height: 12px; background: #f1f5f9; border-radius: 10px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: #f472b6; border-radius: 10px; }
  .bar
